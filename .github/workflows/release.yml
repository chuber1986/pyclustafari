# Release: build with `uv build` and publish to PyPI via trusted
# publishing (OIDC — no stored API token), on a pushed `v*` tag or a
# published GitHub release, gated on the `checks` job from ci.yml.
#
# One-time maintainer setup (PyPI side):
#   - Repo settings → Environments → create `pypi`.
#   - On PyPI, add a "pending publisher" for this repo:
#     owner chuber1986, repository pyclustafari, workflow release.yml,
#     environment pypi. For a brand-new PyPI project the automatic
#     first-publish flow can be used instead.
#
# The version in pyproject.toml must match the tag; the workflow fails
# early otherwise.
name: release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions: {}

jobs:
  checks:
    name: prek (lint, type check, tests)
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish to PyPI
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing exchanges the OIDC token with PyPI.
      id-token: write
    environment: pypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed: the published artifacts must not embed the
        # vendored pyslurm source (it stays an ordinary PyPI dependency).

      - name: uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Assert tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${tag}" ]; then
            echo "::error::tag ${tag} does not match pyproject.toml version ${version}"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
