site_name: pyclustafari
site_description: "Run Python functions on a Slurm cluster from a script or notebook."
repo_url: https://github.com/chuber1986/pyclustafari
repo_name: pyclustafari
docs_dir: docs
site_dir: site

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - Modules: api.md
  - Contributing: contributing.md
  - Changelog: changelog.md

theme:
  name: readthedocs
  logo: assets/SAL_Logo_ohneZusatz.svg
  include_homepage_in_sidebar: true
  navigation_depth: 4
  titles_only: false
  sticky_navigation: true
  highlightjs: true
  hljs_style: github
  custom_dir: overrides

markdown_extensions:
  - admonition
  - codehilite
  - toc
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.mark
  - pymdownx.tasklist

plugins:
  - search
  - include-markdown
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
