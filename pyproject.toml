[project]
# PyPI/distribution name; the import package stays `clustafari`
# (module-name below), see README "Name mapping".
name = "pyclustafari"
version = "0.2.0"
description = "Runs Python function on a cluster."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Christian Huber", email = "hiddenaddress@gmail.com" },
]
maintainers = [
    { name = "Christian Huber", email = "hiddenaddress@gmail.com" }
]
keywords = ["execution", "cluster", "slurm", "interactive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Distributed Computing",
]
requires-python = ">=3.12"
dependencies = [
    "pyprojroot",
    "pyyaml",
    "joblib",
    "pyslurm",
    "dill>=0.4",
]

[dependency-groups]
dev = [
    "prek>=0.5.4,<0.6.0",
    "pytest>=7.2.0",
    "pytest_cov>=4.0.0",
    "ipykernel>=7.1.0",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "jupyter",
    "uv>=0.9.25",
    "ruff>=0.14.11",
]
docs = [
    "mkdocs-include-markdown-plugin>=3.9.1",
    "mkdocstrings[python]>=0.28",
]

[project.urls]
Homepage = "https://github.com/chuber1986/pyclustafari"
Documentation = "https://github.com/chuber1986/pyclustafari"
Repository = "https://github.com/chuber1986/pyclustafari"
"Bug Tracker" = "https://github.com/chuber1986/pyclustafari/issues"
Changelog = "https://github.com/chuber1986/pyclustafari/blob/main/CHANGELOG.md"

[tool.uv.sources]
# The pyslurm git submodule checked out at the commit this tree was developed
# and tested against (Slurm 26.05.x; branch 26.5.x, commit 1e97f854).
# `uv sync` builds the checked-out source against the local/CI Slurm 26.05
# headers/libraries (CI extracts them from the giovtorres/slurm-docker image,
# see .github/workflows/ci.yml). To move to a new Slurm/pyslurm version:
#   1. in third-party/pyslurm: git fetch && git checkout <commit> (the tip of
#      the branch for the new Slurm version),
#   2. uv lock,
#   3. commit the updated submodule pointer.
pyslurm = { path = "third-party/pyslurm" }


[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Distribution `pyclustafari` provides the `clustafari` module (src/clustafari).
module-name = "clustafari"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN202", "ANN401", "COM812", "D203", "D212", "D213", "D105", "EXE002", "S311", "S101", "PLC0415"]

[tool.ruff]
exclude = [
  "tests"
]
line-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
