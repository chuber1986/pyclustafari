[project]
name = "clustafari"
version = "0.1.0"
description = "Runs Python function on a cluster."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
authors = [
    { name = "Christian Huber", email = "hiddenaddress@gmail.com" },
]
maintainers = [
    { name = "Christian Huber", email = "hiddenaddress@gmail.com" }
]
keywords = ["execution", "cluster", "slurm", "interactive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python"
]
requires-python = ">=3.12"
dependencies = [
    "pyprojroot",
    "pyyaml",
    "joblib",
    "pyslurm",
]

[dependency-groups]
dev = [
    "prek>=0.5.4,<0.6.0",
    "pytest-runner>=6.0.0",
    "pytest>=7.2.0",
    "pytest_cov>=4.0.0",
    "ipykernel>=7.1.0",
    "numpy",
    "matplotlib",
    "scikit-learn",
    "jupyter",
    "uv>=0.9.25",
    "ruff>=0.14.11",
]
docs = [
    "mkdocs-include-markdown-plugin>=3.9.1",
    "mkdocstrings[python]>=0.28",
]

[project.urls]
Homepage = "https://github.com/chuber1986/pyclustafari"
Documentation = "https://github.com/chuber1986/pyclustafari"
Repository = "https://github.com/chuber1986/pyclustafari"
"Bug Tracker" = "https://github.com/chuber1986/pyclustafari/issues"
Changelog = "https://github.com/chuber1986/pyclustafari/blob/main/CHANGELOG.md"

[tool.uv.sources]
# Pinned to the pyslurm commit this tree was developed and tested against
# (Slurm 26.05.x). Bump `rev` when moving to a new Slurm/pyslurm version and
# re-lock. CI builds it against Slurm 26.05 headers/libraries extracted from
# the giovtorres/slurm-docker image (see .github/workflows/ci.yml).
pyslurm = { git = "https://github.com/PySlurm/pyslurm.git", rev = "1e97f854a871fdd8f2adebffc2f9418eb40a58b6" }


[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
data = { scripts = "scripts" }



[tool.ruff.lint]
select = ["ALL"]
ignore = ["ANN202", "ANN401", "COM812", "D203", "D212", "D213", "D105", "EXE002", "S311", "S101", "PLC0415"]

[tool.ruff]
exclude = [
  "tests"
]
line-length = 120

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
